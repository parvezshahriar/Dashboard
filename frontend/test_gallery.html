<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        h1 {
            color: #333;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .image-card {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .image-card img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Image Gallery Test</h1>
        
        <div id="status" class="status loading">Loading...</div>
        
        <div id="gallery" class="gallery">
        </div>
    </div>

    <script>
        async function testGallery() {
            try {
                // Step 1: Login
                console.log('[TEST] Logging in...');
                const loginResponse = await fetch('http://127.0.0.1:8000/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: 'admin', password: 'admin123'})
                });
                
                if (!loginResponse.ok) {
                    throw new Error(`Login failed: ${loginResponse.status}`);
                }
                
                const loginData = await loginResponse.json();
                const userId = loginData.user_id;
                
                if (!userId) {
                    throw new Error('No user_id returned from login');
                }
                
                console.log(`[TEST] Login successful! User ID: ${userId}`);
                
                // Step 2: Fetch user images
                console.log(`[TEST] Fetching images for user ${userId}...`);
                const imagesResponse = await fetch(`http://127.0.0.1:8000/user-images/${userId}`);
                
                if (!imagesResponse.ok) {
                    throw new Error(`Failed to fetch images: ${imagesResponse.status}`);
                }
                
                const imagesData = await imagesResponse.json();
                const images = imagesData.images || [];
                
                console.log(`[TEST] Found ${images.length} images`);
                
                // Step 3: Display images
                const gallery = document.getElementById('gallery');
                const statusDiv = document.getElementById('status');
                
                if (images.length === 0) {
                    statusDiv.className = 'status error';
                    statusDiv.innerHTML = `✗ No images found for user ${userId}`;
                    return;
                }
                
                images.forEach(image => {
                    const card = document.createElement('div');
                    card.className = 'image-card';
                    card.innerHTML = `
                        <img src="http://127.0.0.1:8000${image.view_url}" alt="${image.original_filename}" />
                        <div><strong>${image.original_filename}</strong></div>
                        <div style="font-size: 0.9em; color: #666;">ID: ${image.id}</div>
                        <div style="font-size: 0.85em; color: #999;">${new Date(image.created_at).toLocaleDateString()}</div>
                    `;
                    gallery.appendChild(card);
                });
                
                statusDiv.className = 'status success';
                statusDiv.innerHTML = `✓ Successfully loaded ${images.length} image(s) from database for user ${userId}`;
                
            } catch (error) {
                console.error('[TEST] Error:', error);
                const statusDiv = document.getElementById('status');
                statusDiv.className = 'status error';
                statusDiv.innerHTML = `✗ Error: ${error.message}`;
            }
        }
        
        // Run test on page load
        window.addEventListener('DOMContentLoaded', testGallery);
    </script>
</body>
</html>
