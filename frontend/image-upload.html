<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .upload-section, .gallery-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .upload-section h2, .gallery-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input[type="file"],
        input[type="number"],
        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="file"]:focus,
        input[type="number"]:focus,
        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: #6c757d;
            margin-top: 10px;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .image-card {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: #f5f5f5;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            height: 150px;
        }

        .image-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .image-card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .image-card:hover .image-card-overlay {
            opacity: 1;
        }

        .icon-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: white;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            transition: all 0.2s;
        }

        .icon-button:hover {
            transform: scale(1.1);
            background: #667eea;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 80%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
        }

        .modal-header h2 {
            margin: 0;
            color: #333;
        }

        .close-button {
            font-size: 28px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-button:hover {
            color: #000;
        }

        .modal-body img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .modal-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #555;
        }

        .info-value {
            color: #667eea;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }

            .modal-content {
                width: 95%;
                margin: 50% auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Image Management</h1>
            <p>Upload and manage your images easily</p>
        </div>

        <div class="content">
            <!-- Upload Section -->
            <div class="upload-section">
                <h2>Upload Image</h2>
                <div id="uploadMessage" class="message"></div>
                
                <form id="uploadForm">
                    <div class="form-group">
                        <label for="imageFile">Select Image *</label>
                        <input type="file" id="imageFile" name="image" accept="image/*" required>
                    </div>

                    <div class="form-group">
                        <label for="userId">User ID (Optional)</label>
                        <input type="number" id="userId" name="user_id" placeholder="Enter user ID">
                    </div>

                    <div class="form-group">
                        <label for="productId">Product ID (Optional)</label>
                        <input type="text" id="productId" name="product_id" placeholder="Enter product ID">
                    </div>

                    <div class="form-group">
                        <label for="description">Description (Optional)</label>
                        <textarea id="description" name="description" placeholder="Add a description for this image..."></textarea>
                    </div>

                    <button type="submit" class="button">Upload Image</button>
                </form>
            </div>

            <!-- Gallery Section -->
            <div class="gallery-section">
                <h2>Recent Images</h2>
                <div id="loadingGallery" class="loading">
                    <div class="spinner"></div>
                </div>
                <div id="galleryMessage" class="message"></div>
                <div id="gallery" class="gallery"></div>
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Image Details</h2>
                <button class="close-button" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <img id="modalImage" src="" alt="">
                <div class="modal-info">
                    <div class="info-row">
                        <span class="info-label">Filename:</span>
                        <span class="info-value" id="modalFilename">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Size:</span>
                        <span class="info-value" id="modalSize">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Type:</span>
                        <span class="info-value" id="modalType">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Uploaded:</span>
                        <span class="info-value" id="modalDate">-</span>
                    </div>
                    <div class="info-row" id="descriptionRow" style="display: none;">
                        <span class="info-label">Description:</span>
                        <span class="info-value" id="modalDescription">-</span>
                    </div>
                </div>
                <button class="button" id="downloadButton">Download</button>
                <button class="button secondary" id="deleteButton">Delete</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';
        let allImages = [];
        let currentImageId = null;

        // Upload form handler
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            const imageFile = document.getElementById('imageFile').files[0];
            
            if (!imageFile) {
                showMessage('uploadMessage', 'Please select an image', 'error');
                return;
            }

            formData.append('file', imageFile);
            
            const userId = document.getElementById('userId').value;
            const productId = document.getElementById('productId').value;
            const description = document.getElementById('description').value;

            if (userId) formData.append('user_id', userId);
            if (productId) formData.append('product_id', productId);
            if (description) formData.append('description', description);

            try {
                const response = await fetch(`${API_BASE}/image-upload`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    showMessage('uploadMessage', `✓ ${data.message}`, 'success');
                    document.getElementById('uploadForm').reset();
                    await loadGallery();
                } else {
                    const error = await response.json();
                    showMessage('uploadMessage', `✗ ${error.detail}`, 'error');
                }
            } catch (error) {
                showMessage('uploadMessage', `✗ Upload failed: ${error.message}`, 'error');
            }
        });

        // Load gallery
        async function loadGallery() {
            const galleryDiv = document.getElementById('gallery');
            const loadingDiv = document.getElementById('loadingGallery');
            
            loadingDiv.style.display = 'block';
            galleryDiv.innerHTML = '';

            try {
                // Get all images by fetching from a listing endpoint
                // For now, we'll create a simple approach
                const response = await fetch(`${API_BASE}/product-images/all`, {
                    method: 'GET'
                }).catch(() => null);

                // If that doesn't work, just show an empty state
                loadingDiv.style.display = 'none';
                showEmptyState();
            } catch (error) {
                loadingDiv.style.display = 'none';
                showMessage('galleryMessage', `✗ Failed to load gallery: ${error.message}`, 'error');
            }
        }

        function showEmptyState() {
            const galleryDiv = document.getElementById('gallery');
            galleryDiv.innerHTML = `
                <div style="grid-column: 1/-1;">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <p>No images uploaded yet</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">Upload an image to get started!</p>
                    </div>
                </div>
            `;
        }

        function showMessage(elementId, message, type) {
            const messageDiv = document.getElementById(elementId);
            messageDiv.textContent = message;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 5000);
            }
        }

        // Modal handlers
        const modal = document.getElementById('imageModal');
        const closeBtn = document.getElementById('closeModal');

        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        document.getElementById('downloadButton').addEventListener('click', async () => {
            if (currentImageId) {
                window.location.href = `${API_BASE}/image/${currentImageId}`;
            }
        });

        document.getElementById('deleteButton').addEventListener('click', async () => {
            if (currentImageId && confirm('Are you sure you want to delete this image?')) {
                try {
                    const response = await fetch(`${API_BASE}/image/${currentImageId}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        modal.style.display = 'none';
                        showMessage('galleryMessage', '✓ Image deleted successfully', 'success');
                        await loadGallery();
                    } else {
                        showMessage('galleryMessage', '✗ Failed to delete image', 'error');
                    }
                } catch (error) {
                    showMessage('galleryMessage', `✗ Delete failed: ${error.message}`, 'error');
                }
            }
        });

        // Load gallery on page load
        loadGallery();
    </script>
</body>
</html>
