<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagad Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="bg-decoration"></div>

    <div class="login-container">
        <div class="logo-section">
            <img src="C:\Users\shahriar.shaon\Desktop\Dashboard\frontend\Untitled design (1).png" alt="" class="logo">
        </div>

        <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
            
            <div class="input-group">
                <div class="icon-wrapper">
                    <i class="fa-solid fa-user"></i>
                </div>
                <input type="text" id="username" placeholder="user name" required>
            </div>

            <div class="input-group">
                <div class="icon-wrapper">
                    <i class="fa-solid fa-key"></i>
                </div>
                <input type="password" id="password" placeholder="password" required>
            </div>

            <div class="forgot-password">
                <a href="#">Forgot your password?</a>
            </div>

            <button type="submit" class="login-btn">LOG IN</button>
        </form>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            console.log('[LOGIN] Attempting login for user:', username);
            
            try {
                const response = await fetch('http://127.0.0.1:8000/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const result = await response.json();
                console.log('[LOGIN] Response:', result);
                
                if (response.ok) {
                    console.log('[LOGIN] Login successful for user:', result.username);
                    // Store user info in localStorage
                    localStorage.setItem('userId', result.id);
                    localStorage.setItem('username', result.username);
                    localStorage.setItem('userRole', result.role);  // Store user role for RBAC
                    // Redirect to dashboard immediately
                    window.location.href = 'index.html';
                } else {
                    alert(`Login failed: ${result.detail || 'Invalid credentials'}`);
                }
            } catch (error) {
                console.error('[LOGIN] Error:', error);
                alert('Error connecting to server. Please try again.');
            }
        }
    </script>
