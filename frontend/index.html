<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government Disbursement Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="container">
    <aside class="sidebar">
        <div class="brand">
            <div class="logo-placeholder">
                <i class="fa-solid fa-fire"></i> <span style="font-weight:bold;">নগদ</span>
            </div>
        </div>
        
        <div class="sidebar-menu">
            <h3>Government Disbursement</h3>
            <ul>
                <li class="active"><i class="fa-solid fa-file-upload"></i> Upload History</li>
                <li><i class="fa-solid fa-list"></i> Transaction History</li>
                <li><i class="fa-solid fa-shield-halved"></i> Audit History</li>
            </ul>
        </div>
        
        <div class="sidebar-footer">
            <i class="fa-solid fa-angles-right"></i>
        </div>
    </aside>

    <main class="main-content">
        <header>
            <div class="header-left">
                <h1>Government Disbursement</h1>
                <!-- <p>Sonali Bank PLC portal for government disbursement file upload</p> -->
            </div>
            <div class="header-right">
                <!-- <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <i class="fa-solid fa-grip"></i> -->
                <div class="notification">
                    <!-- <i class="fa-solid fa-bell"></i> -->
                    <!-- <span class="badge">15</span> -->
                </div>
                <div class="user-profile">
                    <!-- <img src="https://via.placeholder.com/32" alt="User">
                    <span>Karim Biswas <i class="fa-solid fa-chevron-down"></i></span> -->
                </div>
            </div>
        </header>

        <section class="filters">
            <div class="date-group">
                <label>START DATE</label>
                <input id="start-date" type="date">
            </div>
            <div class="date-group">
                <label>END DATE</label>
                <input id="end-date" type="date">
            </div>
        </section>

        <section class="table-controls">
            <div class="left-controls">
                <span>Show 
                    <select id="items-per-page">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select> 
                entries</span>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input id="search-input" type="text" placeholder="Search...">
                </div>
            </div>
            <input type="file" id="csv-file-input" accept=".csv" style="display:none;">
            <button class="btn-primary" onclick="document.getElementById('csv-file-input').click()">+ Upload New Batch</button>
        </section>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID <i class="fa-solid fa-sort"></i></th>
                        <th>Product Name</th>
                        <th>Description</th>
                        <th>Price</th>
                        <th>Upload Date</th>
                        <th>Status <i class="fa-solid fa-sort"></i></th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </div>

        <div class="pagination">
            <span>Previous</span>
            <span class="page-num active">1</span>
            <span class="page-num">2</span>
            <span class="page-num">3</span>
            <span>Next</span>
        </div>
    </main>
</div>

<!-- Edit Modal -->
<div id="edit-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Edit Product</h2>
            <span class="close-modal" onclick="closeEditModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Product ID</label>
                <input type="text" id="edit-id" readonly>
            </div>
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="edit-name" placeholder="Enter product name">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="edit-description" placeholder="Enter description" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Price (BDT)</label>
                <input type="number" id="edit-price" placeholder="Enter price" step="0.01">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
            <button class="btn-save" onclick="saveProductChanges()">Save Changes</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
<script src="index.js"></script>
</body>
</html>
