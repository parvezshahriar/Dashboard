<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government Disbursement Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="error-handler.css">
</head>
<body>

<div id="header-container"></div>

<div class="container">
    <div id="sidebar-container"></div>
    
    <main class="main-content">
        <section class="filters">
            <div class="date-group">
                <label>START DATE</label>
                <input id="start-date" type="date">
            </div>
            <div class="date-group">
                <label>END DATE</label>
                <input id="end-date" type="date">
            </div>
            <div class="date-group">
                <button onclick="resetDateFilter()" class="reset-date-btn">Reset Date</button>
            </div>
        </section>

        <section class="table-controls">
            <div class="left-controls">
                <span>Show 
                    <select id="items-per-page">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select> 
                entries</span>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input id="search-input" type="text" placeholder="Search...">
                </div>
            </div>
            <input type="file" id="csv-file-input" accept=".csv" style="display:none;">
            <button class="btn-primary" onclick="document.getElementById('csv-file-input').click()">+ Upload New Batch</button>
        </section>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>EFT Ref <i class="fa-solid fa-sort"></i></th>
                        <th>Account Title</th>
                        <th>Account Type</th>
                        <th>Account No</th>
                        <th>Amount</th>
                        <th>Beneficiary ID</th>
                        <th>Mobile</th>
                        <th>Status <i class="fa-solid fa-sort"></i></th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </div>

        <div class="pagination">
            <span>Previous</span>
            <span class="page-num active">1</span>
            <span class="page-num">2</span>
            <span class="page-num">3</span>
            <span>Next</span>
        </div>
    </main>
</div>

<!-- Edit Modal -->
<div id="edit-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Edit Transaction</h2>
            <span class="close-modal" onclick="closeEditModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>EFT Reference Number</label>
                <input type="text" id="edit-EFTREFNUMBER" readonly>
            </div>
            <div class="form-group">
                <label>Account Title</label>
                <input type="text" id="edit-CRACCOUNTTITLE" placeholder="Enter account title">
            </div>
            <div class="form-group">
                <label>Account Type</label>
                <input type="text" id="edit-CRACCOUNTTYPE" placeholder="Enter account type">
            </div>
            <div class="form-group">
                <label>Account Number</label>
                <input type="text" id="edit-CRACCOUNTNO" placeholder="Enter account number">
            </div>
            <div class="form-group">
                <label>Routing Number</label>
                <input type="text" id="edit-CRROUTINGNO" placeholder="Enter routing number">
            </div>
            <div class="form-group">
                <label>Amount (BDT)</label>
                <input type="number" id="edit-CRAMOUNT" placeholder="Enter amount" step="0.01">
            </div>
            <div class="form-group">
                <label>Beneficiary ID</label>
                <input type="text" id="edit-BENEFICIARY_ID" placeholder="Enter beneficiary ID">
            </div>
            <div class="form-group">
                <label>Mobile</label>
                <input type="text" id="edit-MOBILE" placeholder="Enter mobile number">
            </div>
            <div class="form-group">
                <label>NID Number</label>
                <input type="text" id="edit-NID_NO" placeholder="Enter NID number">
            </div>
            <div class="form-group">
                <label>Ministry Code</label>
                <input type="text" id="edit-MIN_CODE" placeholder="Enter ministry code">
            </div>
            <div class="form-group">
                <label>Department Code</label>
                <input type="text" id="edit-DEPT_CODE" placeholder="Enter department code">
            </div>
            <div class="form-group">
                <label>Payment Cycle</label>
                <input type="text" id="edit-PAYMENT_CYCLE_NAME_EN" placeholder="Enter payment cycle">
            </div>
            <div class="form-group">
                <label>Scheme Code</label>
                <input type="text" id="edit-SCHEME_CODE" placeholder="Enter scheme code">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
            <button class="btn-save" onclick="saveProductChanges()">Save Changes</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
<script src="layout-wrapper.js"></script>
<script src="error-handler.js"></script>
<script src="header.js"></script>
<script src="sidebar.js"></script>
<script src="index.js"></script>
</body>
</html>
